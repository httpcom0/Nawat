<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة بصيغة HTML</title>
<style>
body {
font-family: 'Cairo', Tahoma, sans-serif;
background-color: #f4f7f6;
color: #333;
margin: 0;
padding: 20px;
direction: rtl;
text-align: right;
}
.container {
max-width: 800px;
margin: 0 auto;
background: #ffffff;
padding: 30px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
h1 {
color: #2c3e50;
border-bottom: 2px solid #3498db;
padding-bottom: 10px;
}
p {
line-height: 1.6;
color: #555;
}
.btn {
display: inline-block;
background-color: #3498db;
color: white;
padding: 10px 20px;
text-decoration: none;
border-radius: 5px;
margin-top: 15px;
transition: background 0.3s ease;
}
.btn:hover {
background-color: #2980b9;
}
</style>
</head>
<body>
<div class="container">
<h1>أهلاً بك!</h1>
<p>هذه صفحة ويب نموذجية تم تصميمها وتنسيقها خصيصاً بلغة <strong>HTML</strong> وتصميم <strong>CSS</strong> متجاوب ويدعم اللغة العربية بشكل كامل.</p>
<p>يمكنك استخدام هذا الكود كبداية لأي مشروع ويب بسيط أو تعديله حسب رغبتك.</p>
<a href="#" class="btn">اضغط هنا</a>
</div>
</body>
</html>
